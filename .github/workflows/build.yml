name: build
on:
   push:
      branches:
      - main
   pull_request:
permissions:
   contents: write
jobs:
   build:
      runs-on: ubuntu-latest
      steps:
      -  name: Checkout
         uses: actions/checkout@v7
      -  name: Set up JDK
         uses: actions/setup-java@v6
         with:
            distribution: temurin
            java-version: 21
      -  name: Setup Maven
         uses: stCarolas/setup-maven@v5
         with:
           maven-version: 3.9.16
      -  name: Set up cache
         uses: actions/cache@v6.1.0
         with:
           path: ~/.m2/repository
           key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
           restore-keys: |
             ${{ runner.os }}-maven-
      -  name: Build
         # The end-to-end tests drive a real workbench with SWTBot: they need a display.
         run: |
            set -o pipefail
            xvfb-run -a mvn -B clean install 2>&1 | tee build.log
      -  name: Upload the coverage to Codecov
         uses: codecov/codecov-action@v7
         with:
            files: tests/org.eclipse.ehttpeditor.coverage/target/site/jacoco-aggregate/jacoco.xml
            fail_ci_if_error: true
            token: ${{ secrets.CODECOV_TOKEN }}
      -  name: Coverage by class
         # The line coverage of each class, in the summary of the run and as an annotation.
         run: |
            python3 - tests/org.eclipse.ehttpeditor.coverage/target/site/jacoco-aggregate/jacoco.xml <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
            import sys, xml.etree.ElementTree as ET
            root = ET.parse(sys.argv[1]).getroot()
            def lines(e):
                c = [x for x in e.findall("counter") if x.get("type") == "LINE"]
                return (int(c[0].get("covered")), int(c[0].get("missed"))) if c else (0, 0)
            rows = []
            for p in root.iter("package"):
                for c in p.findall("class"):
                    if "$" in c.get("name"):
                        continue
                    cov, mis = 0, 0
                    for cc in p.findall("class"):
                        if cc.get("name") == c.get("name") or cc.get("name").startswith(c.get("name") + "$"):
                            a, b = lines(cc); cov += a; mis += b
                    if cov + mis:
                        rows.append((mis, cov, c.get("name").split("/")[-1]))
            cov, mis = lines(root)
            out = ["Total: %d%% (%d/%d lines)" % (100 * cov // (cov + mis), cov, cov + mis)]
            for mis, c, name in sorted(rows, reverse=True):
                out.append("%s %d%% (%d missed)" % (name, 100 * c // (c + mis), mis))
            text = "\n".join(out)
            print(text)
            print("::notice title=Coverage::" + text.replace("%", "%25").replace("\n", "%0A"), file=sys.stderr)
            # The minimum coverage of the plug-in
            if 100 * cov < 85 * (cov + mis):
                print("::error title=Coverage::The coverage is under 85%%: %d%%" % (100 * cov // (cov + mis)), file=sys.stderr)
                sys.exit(1)
            PY
      -  name: Report the failure
         # The failure as annotations of the run: readable with the REST API of GitHub.
         if: failure()
         run: |
            annotate() { python3 -c 'import sys,urllib.parse; d=sys.stdin.read()[-60000:]; print("::error title='"$1"'::" + d.replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
            grep -E "\[ERROR\]|Tests run:|FAIL" build.log | head -150 | annotate "Maven errors"
            for f in tests/*/target/surefire-reports/*.txt; do [ -f "$f" ] && cat "$f" | annotate "$(basename $f)"; done
            for f in tests/*/target/work/data/.metadata/.log; do
               [ -f "$f" ] || continue
               # the errors of the Eclipse log, one annotation per entry (annotations are short)
               python3 - "$f" <<'PY'
            import re, sys
            entries = re.split(r"\n(?=!ENTRY )", open(sys.argv[1]).read())
            picked = [e for e in entries if e.startswith("!ENTRY") and (" 4 " in e.split("\n")[0] or "ehttpeditor" in e.lower())]
            for e in picked[-6:]:
                print("::error title=Eclipse log::" + e[:3500].replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
            PY
            done
            true
      -  name: Upload the test reports
         if: failure()
         uses: actions/upload-artifact@v7
         with:
            name: test-reports
            path: |
               tests/*/target/surefire-reports
               tests/*/target/screenshots
               tests/*/target/work/data/.metadata/.log
      -  name: Release
         if: github.event_name == 'push'
         env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         run: |
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest --prerelease --title "Development Build" --target "$GITHUB_SHA" \
               --notes "Latest build of the main branch." \
               update-site/org.eclipse.ehttpeditor/target/org.eclipse.ehttpeditor.updatesite-*-SNAPSHOT.zip \
               products/org.eclipse.ehttpeditor.product/target/products/ehttpeditor-*
      -  name: Publish p2 update site
         if: github.event_name == 'push'
         env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         run: |
            remote="https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY"
            if ! git clone --depth 1 --branch update-site "$remote" site; then
               mkdir site
               git -C site init -b update-site
               git -C site remote add origin "$remote"
            fi
            rm -rf site/latest
            mkdir -p site/latest
            cp -r update-site/org.eclipse.ehttpeditor/target/repository/* site/latest/
            cd site
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "New version of the update site"
            git push origin update-site
